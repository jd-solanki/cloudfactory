# Reusable workflow published to users of the Code Factory.
#
# A calling repository adds:
#
#   on:
#     pull_request_target:
#       types: [labeled]
#   jobs:
#     review:
#       uses: jd-solanki/cloudfactory/.github/workflows/review.yml@main
#       secrets: inherit
#
# This workflow forwards repository coordinates only. It never checks out
# pull-request code, so `pull_request_target` exposes no secret to a fork.
name: Code Factory review

on:
  workflow_call:
    inputs:
      label:
        description: Label that requests a review.
        type: string
        default: "agent:review"
      workflow-name:
        description: Name of the Cloudflare Workflow to start.
        type: string
        default: review
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token with account-scoped Workers Scripts Write.
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account that hosts the review Worker.
        required: true

permissions: {}

jobs:
  start-review:
    if: github.event.label.name == inputs.label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the review Workflow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_NAME: ${{ inputs.workflow-name }}
          OWNER: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances"

          # A deterministic id makes a redelivered event a no-op instead of a
          # second Run. The distinguishing parts lead, so the 100-character
          # limit can only truncate the repository slug.
          slug=$(printf '%s' "${OWNER}-${REPO}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          instance_id="review-${HEAD_SHA:0:12}-${PULL_NUMBER}-${slug}"
          instance_id="${instance_id:0:100}"

          params=$(jq -nc \
            --arg owner "$OWNER" \
            --arg repo "$REPO" \
            --argjson pullNumber "$PULL_NUMBER" \
            --arg headSha "$HEAD_SHA" \
            '{version: 1, owner: $owner, repo: $repo, pullNumber: $pullNumber, headSha: $headSha}')

          # The Workflows API takes `params` as a JSON object and hands it to
          # the Workflow verbatim. Its API reference calls this field a string,
          # but a string arrives as a string and never as the payload.
          body=$(jq -nc --arg id "$instance_id" --argjson params "$params" \
            '{instance_id: $id, params: $params}')

          status=$(curl -sS -o create.json -w '%{http_code}' -X POST "$base" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body")

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Started Workflow instance ${instance_id}."
            exit 0
          fi

          # The instance id is derived from the revision, so a redelivered event
          # and a deliberate re-request look identical here. The API publishes no
          # stable code for a duplicate id either. Ask what the instance is doing
          # instead, and let its state decide.
          existing=$(curl -sS -o instance.json -w '%{http_code}' "${base}/${instance_id}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          if [ "$existing" -lt 200 ] || [ "$existing" -ge 300 ]; then
            echo "Cloudflare rejected the request with HTTP ${status}." >&2
            jq -r '.errors // .' create.json >&2
            exit 1
          fi

          state=$(jq -r '.result.status // "unknown"' instance.json)

          case "$state" in
            errored | terminated | complete)
              # A finished Run for this revision. Somebody is asking again, so
              # start it over rather than refusing.
              restart=$(curl -sS -o restart.json -w '%{http_code}' -X PATCH \
                "${base}/${instance_id}/status" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"status": "restart"}')

              if [ "$restart" -ge 200 ] && [ "$restart" -lt 300 ]; then
                echo "Restarted Workflow instance ${instance_id}, which was ${state}."
                exit 0
              fi

              echo "Could not restart ${instance_id}: HTTP ${restart}." >&2
              jq -r '.errors // .' restart.json >&2
              exit 1
              ;;
            *)
              # Still queued, running, waiting or paused. A redelivered event
              # must not disturb a Run that is already in flight.
              echo "Workflow instance ${instance_id} is ${state}. Nothing to do."
              exit 0
              ;;
          esac
